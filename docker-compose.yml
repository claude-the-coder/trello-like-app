services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mytrello
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./apps/backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/mytrello?schema=public"
    depends_on:
      - db

  web:
    build: ./apps/web
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  pgdata:
